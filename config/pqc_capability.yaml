# PQC capability thresholds for crypto libraries.
#
# Answers the question that actually gates a migration plan: on how many hosts
# is the crypto stack even capable of negotiating a hybrid key exchange. A host
# below the threshold is a package-upgrade ticket, not a crypto-policy ticket,
# and separating those two populations is most of the work.
#
# `pqc_hybrid_kex_from` is the first version where a hybrid PQC key agreement
# group is available to TLS 1.3 clients and servers using the library defaults
# or a supported configuration switch.
#
# `null` means unknown. Unknown stays unknown: the resolver reports it as such
# rather than guessing, because a wrong threshold silently reclassifies an
# entire population and nobody rechecks a number that already looks plausible.

version: 1.1
updated: 2026-08-03

libraries:
  openssl:
    pqc_hybrid_kex_from: "3.5.0"
    provenance: measured
    note: >
      X25519MLKEM768 available and among the default groups. 3.5 is an LTS
      release supported to April 2030.
    references:
      - https://openssl-library.org/news/openssl-3.5-notes/

  gnutls:
    pqc_hybrid_kex_from: "3.8.8"
    provenance: measured
    note: >
      X25519MLKEM768 and SecP256r1MLKEM768 available in TLS 1.3 from 3.8.8
      (2024-11-05), marked experimental, following draft-kwiatkowski-tls-ecdhe-mlkem
      and requiring liboqs >= 0.11.0 (or leancrypto from 3.8.9). "Experimental"
      is the library's own label; treat a 3.8.8-3.8.x host as capable but flag
      that the build flags actually enabling it must be confirmed.
    references:
      - https://www.mail-archive.com/gnutls-help@lists.gnutls.org/msg01835.html

  nss:
    pqc_hybrid_kex_from: "3.118"
    provenance: measured
    note: >
      Standardised ML-KEM hybrid TLS groups landed in NSS 3.118 (2025-11-18):
      that release adds secp256r1mlkem768 and secp384r1mlkem1024 and makes
      mlkem768x25519 (the standardised X25519MLKEM768, IANA 0x11EC) the default
      (Bug 1983313). The pre-standard draft group (xyber768d00) is not counted:
      NSS 3.116 (2025-09-11) explicitly DISABLED kyber, and 3.117 added no
      TLS ML-KEM groups, so 3.118 is the genuine cutover with no non-default
      window to under-count. A host below 3.118 is not_capable of the
      standardised hybrid.
    references:
      - https://firefox-source-docs.mozilla.org/security/nss/releases/nss_3_118.html
      - https://firefox-source-docs.mozilla.org/security/nss/releases/nss_3_116.html

  wolfssl:
    pqc_hybrid_kex_from: "5.8.0"
    provenance: measured
    note: >
      Hybrid groups combining ECC (SECP256/384/521, X25519, X448) with ML-KEM,
      using the standardised IANA codepoints, from 5.8.0 (2025-05). Earlier
      releases had some hybrid groups under pre-standard codepoints; 5.8.0 is
      the interoperable boundary, so it is the defensible threshold. Requires a
      build with --enable-kyber and PQC TLS 1.3 cipher suites.
    references:
      - https://www.wolfssl.com/hybrid-post-quantum-key-exchange-in-wolfssl-5-8-0/

  libressl:
    pqc_hybrid_kex_from: null
    pqc_absent_through: "3.9"
    provenance: measured
    note: >
      Sourced negative, not merely unknown. A 2025 survey of PQC support across
      cryptographic libraries found LibreSSL ships no NIST PQC algorithms in any
      released version, examining the 3.7-3.9 release notes (2022-2024) and
      reporting no announced roadmap. `pqc_absent_through: "3.9"` is the highest
      version with that confirmation, so <= 3.9 resolves not_capable (measured),
      while a newer LibreSSL (>= 4.0) resolves unknown rather than being assumed
      incapable - the absence was never verified there. Re-check when LibreSSL
      publishes ML-KEM TLS support.
    references:
      - https://arxiv.org/html/2508.16078v1

  boringssl:
    pqc_hybrid_kex_from: null
    provenance: not_applicable
    note: >
      Vendored per product and versioned by commit rather than by a comparable
      release string. Capability must be attributed to the consuming product,
      not to a library version. Any inventory row naming boringssl is reported
      as unknown by design.

# Substring patterns that map an inventory row to a library key above.
# Matched case-insensitively against the software name and vendor.
name_patterns:
  openssl: [openssl, "libssl", "libcrypto"]
  gnutls: [gnutls]
  nss: ["nss", "libnss3", "network security services"]
  wolfssl: [wolfssl]
  libressl: [libressl]
  boringssl: [boringssl]
