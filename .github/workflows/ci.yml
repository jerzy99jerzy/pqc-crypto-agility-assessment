name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest pysigma

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Sigma pack structure
        run: python tests/validate_sigma.py

      # Fails the build if a horizon edit reintroduces component saturation.
      - name: Scoring config validation
        run: python scoring/hndl_score.py --validate-config

      # Fails the build if a host identifier reaches a committed artefact.
      - name: Disclosure lint
        run: python tests/lint_disclosure.py
