[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-crypto-agility-assessment"
version = "0.15.0"
description = "Repeatable PQC inventory pipeline: passive CT, HNDL scoring, Sigma/KQL detection, capability resolution"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "cryptography>=42.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pysigma>=0.11",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Console scripts remove the need to invoke modules by path. After
# `pip install -e .` these are on PATH and the Makefile calls them.
[project.scripts]
pqc-select      = "ananke.collectors.select_targets:main"
pqc-collect     = "ananke.collectors.passive_cert:main"
pqc-score       = "ananke.scoring.hndl_score:main"
pqc-capability  = "ananke.inventory.pqc_capability:main"
pqc-handshake   = "ananke.active.handshake_demo:main"
pqc-report      = "ananke.reporting.build_report:main"
pqc-fixture     = "ananke.fixture:main"
pqc-crosscheck  = "ananke.collectors.crosscheck:main"
pqc-keys        = "ananke.collectors.keys:main"

[tool.setuptools]
# One namespace. Five top-level packages named `collectors`, `scoring` and
# the like were collision candidates in any environment that installed them.
packages = [
    "ananke",
    "ananke.collectors",
    "ananke.active",
    "ananke.scoring",
    "ananke.inventory",
    "ananke.reporting",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ananke"]
omit = [
    "*/__init__.py",
    # Honest exclusions: these cannot be exercised offline and pretending they
    # are covered would be the kind of dishonesty the project exists to avoid.
    #   - the subprocess branch of the handshake (needs an OpenSSL 3.5 client)
    #   - argparse main() wrappers, tested via their callees not the CLI shell
]

[tool.coverage.report]
# Floor is deliberately modest. Measured logic (parsers, scoring, resolver,
# disclosure guard, store, retry ladder) sits well above it; the gap to 100%
# is almost entirely argparse main() wrappers, which are exercised through
# their callees rather than through the CLI shell. Raising the floor by mocking
# argparse would buy a bigger number and no more real coverage. If the figure
# drops below this, logic coverage regressed and the build should fail.
#
# Ratchet: raised 65 -> 70 in 0.6.0, once sprint-6 tests took measured coverage
# to 73.85%. The remaining margin is headroom against refactors, not slack to
# spend.
fail_under = 70
show_missing = true
# Lines that are unreachable without a network or an external binary are
# marked in-source with `# pragma: no cover`, so the floor measures logic that
# is actually testable here rather than being gamed by excluding whole files.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 is handled by line-length; the rest is the default set plus import order.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
# Deliberately not strict. The value here is catching a None flowing into a
# branch that assumes a value - the tri-state convention makes that the most
# likely defect shape in this codebase - not annotating every helper.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
